<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Editor</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
	  
    <div>
        <svg width="100vw" height="100vh" id="svg" xmlns="https://www.w3.org/2000/svg">
			<defs>
				<pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
					<path d="M 10 0 L 0 0 0 10" fill="none" stroke="white" stroke-width="0.5"/>
				</pattern>
				<pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
					<rect width="100" height="100" fill="url(#smallGrid)"/>
					<path d="M 100 0 L 0 0 0 100" fill="none" stroke="white" stroke-width="1"/>
				</pattern>
			</defs>

			<!--Grid-->
			<rect width="1000px" height="1000px" fill="url(#grid)" />

			<!--Axis-->
			<path d="M 500 0 L 500 1000" stroke="red"   stroke-width="1" />
			<path d="M 0 500 L 1000 500" stroke="green" stroke-width="1" />
			
			<!--Borders   CAN BE CONDENCED-->
			<path d="M 0 0 L 1000 0" fill="none" stroke="gray" stroke-width="1"/>
			<path d="M 0 0 L 0 1000" fill="none" stroke="gray" stroke-width="1"/>
			<path d="M 1000 0 L 1000 1000" fill="none" stroke="gray" stroke-width="1"/>
			<path d="M 0 1000 L 1000 1000" fill="none" stroke="gray" stroke-width="1"/>

			<g id="displayTemplate"></g>
		
			<foreignObject x="0" y="0" width="1000" height="1000">
				<div id="project-root">
				</div>
			</foreignObject>

			<g id="snap-lines"></g>
		</svg>
    </div>
    <script type="module" src="./index.js"></script>
	<script type="module" src="./UI/Utils.js"></script>
    </body>
</html>
